<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Just Grow — Nordic Clarity</title></head><body>
<script>
(async()=>{
  const r=await fetch('just-grow-v1-standalone.html',{cache:'no-store'});
  let s=await r.text();
  const css="\n/* v8 — Nordic Clarity */\n:root{--ink:#262b3c;--brand:#4c5270;--brand-dark:#34394f;--paper:#fcfcfd;--sand:#f2eee8;--mist:#f0f1f5;--line:#dfe1e7;--soft:#74798a;--shadow:0 20px 55px rgba(38,43,60,.09);--radius:22px}\nbody{background:#fcfcfd;color:var(--ink);font-size:16.5px}.container{width:min(1200px,calc(100% - 48px))}\n.site-header{background:rgba(252,252,253,.94);border-bottom:1px solid rgba(76,82,112,.09);backdrop-filter:blur(16px)}.nav{height:88px}.brand-logo{width:154px!important;height:68px!important}.nav-links{gap:8px}.nav-links a{padding:10px 14px;border-radius:999px;font-size:.9rem}.nav-links a:hover,.nav-links a.active{background:#efeff4;color:var(--brand)}\n.hero{padding:54px 0 78px;background:linear-gradient(180deg,#fcfcfd 0,#f7f7fa 100%)}.hero-grid{grid-template-columns:.9fr 1.1fr;gap:34px;align-items:stretch}.hero-copy{padding:64px 10px 54px 0;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(3.35rem,5.8vw,5.9rem);line-height:.98;letter-spacing:-.055em}.hero .lead{max-width:620px}.hero-photo{min-height:650px;border-radius:34px;box-shadow:none}.hero-quote{left:26px;right:26px;bottom:26px;border:1px solid rgba(76,82,112,.08);border-radius:18px;box-shadow:0 12px 34px rgba(38,43,60,.10)}\n.stats{padding:0 0 86px;background:#f7f7fa}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:transparent;border:0}.stat{background:#fff;border:1px solid rgba(76,82,112,.08)!important;border-radius:18px;padding:24px}.stat strong{font-size:1.8rem}.stat span{font-size:.76rem;letter-spacing:.02em}\n.section{padding:112px 0}.section.soft{background:#f2eee8}.section.mist{background:#eff0f4}.section-head{max-width:900px;margin-bottom:48px}.section-head h2{font-size:clamp(2.5rem,4.2vw,4rem)}.route-grid{gap:16px}.route{padding:40px;border:1px solid rgba(76,82,112,.09);border-radius:22px;background:#fff;box-shadow:none}.route:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.route:after{width:42px;height:42px;border-radius:50%;background:#f0f0f5;display:grid;place-items:center}.two-col{gap:76px}.photo-card{border-radius:28px;box-shadow:none}.content-card,.review,.trust-card,.episode,.info-card,.training-card{border-radius:20px;border-color:rgba(76,82,112,.10);box-shadow:none;background:#fff}.review{padding:34px}.trust-grid{gap:16px}.media-featured,.media-logo-grid{gap:12px}.media-card,.media-logo-small{border-radius:18px;border-color:rgba(76,82,112,.08);background:#fff}.quote{border-left:3px solid var(--brand);background:rgba(255,255,255,.5);border-radius:0 16px 16px 0}\n.page-hero{padding:50px 0 78px;background:#f7f7fa}.page-hero>.container{gap:56px}.page-hero h1{font-size:clamp(3.2rem,5vw,5.2rem)}.page-hero-photo{border-radius:28px;box-shadow:none}.cta{padding:98px 0;background:#fff}.cta-box{border:0;border-radius:24px;background:var(--brand);color:#fff;padding:48px}.cta-box h2{color:#fff}.cta-box p{color:rgba(255,255,255,.78)}.cta-box .btn{background:#fff;color:var(--brand);border-color:#fff}.site-footer{background:#34394f}\n.section.mist .content-card,.section.mist .training-card,.section.mist .info-card,.section.mist .episode,.section.mist .contact-panel{color:var(--ink)}.section.mist .content-card h2,.section.mist .content-card h3,.section.mist .training-card h2,.section.mist .training-card h3,.section.mist .info-card h2,.section.mist .info-card h3,.section.mist .episode h2,.section.mist .episode h3,.section.mist .contact-panel h2,.section.mist .contact-panel h3{color:var(--brand-dark)}\n@media(max-width:900px){.container{width:min(100% - 32px,1200px)}.hero{padding-top:34px}.hero-grid{grid-template-columns:1fr}.hero-copy{padding:34px 0 10px}.hero-photo{min-height:500px}.stats-grid{grid-template-columns:1fr 1fr}.two-col{gap:42px}.page-hero>.container{gap:34px}}@media(max-width:560px){.hero h1{font-size:3.25rem}.stat{padding:20px 16px}.section{padding:82px 0}.route{padding:30px}.cta-box{padding:34px 28px}}\n";
  s=s.replace(/<body class="design-v\d+"[^>]*>/, '<body class="design-v8" data-design="Nordic Clarity">');
  s=s.replace('</head>','<style>'+css+'</style></head>');
  document.open(); document.write(s); document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">Kon deze ontwerpvariant niet laden.</p>';console.error(e)});
</script></body></html>
