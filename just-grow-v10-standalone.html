<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Just Grow — Quiet Confidence</title></head><body>
<script>
(async()=>{
  const r=await fetch('just-grow-v1-standalone.html',{cache:'no-store'});
  let s=await r.text();
  const css="\n/* v10 — Quiet Confidence */\n:root{--ink:#252b3d;--brand:#4c5270;--brand-dark:#2d3249;--paper:#fbfaf8;--sand:#efe8df;--mist:#eceef2;--line:#d7d9e0;--soft:#717687;--shadow:0 24px 70px rgba(37,43,61,.14);--radius:30px}\nbody{background:#fbfaf8;color:var(--ink)}.site-header{background:var(--brand-dark);border-bottom:0}.nav{height:94px}.brand-logo{filter:brightness(0) invert(1);width:160px!important;height:72px!important}.nav-links a{color:rgba(255,255,255,.80)}.nav-links a:hover,.nav-links a.active{color:#fff}.menu-btn{color:#fff}\n.hero{padding:0;background:var(--brand-dark);color:#fff;overflow:hidden}.hero>.container{width:min(1320px,100%);padding-left:max(44px,calc((100% - 1180px)/2));margin:0}.hero-grid{grid-template-columns:.88fr 1.12fr;gap:58px;min-height:700px}.hero-copy{padding:96px 0 98px;align-self:center}.hero h1{color:#fff;font-size:clamp(3.5rem,6vw,6rem);line-height:.98}.hero .lead{color:rgba(255,255,255,.80);max-width:650px}.hero .eyebrow{color:#ddd4c8}.hero .btn{background:#fff;color:var(--brand-dark);border-color:#fff}.hero .btn.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}.hero-photo{min-height:700px;border-radius:42px 0 0 42px;box-shadow:none}.hero-quote{left:28px;right:38px;bottom:30px;background:rgba(255,255,255,.94);border-radius:20px;color:var(--brand-dark)}\n.stats{padding:0 0 88px;background:linear-gradient(var(--brand-dark) 0 45px,#fbfaf8 45px)}.stats-grid{border:0;border-radius:28px;background:#fff;box-shadow:var(--shadow)}.stat{padding:30px 26px}.stat strong{font-size:2rem}\n.section{padding:112px 0}.section.soft{background:#efe8df}.section.mist{background:#edf0f3}.section-head{max-width:900px}.route-grid{gap:22px}.route{border:0;border-radius:28px;padding:44px;box-shadow:0 14px 42px rgba(37,43,61,.07);background:#fff}.route:first-child{background:var(--brand);color:#fff}.route:first-child h3,.route:first-child .eyebrow,.route:first-child a{color:#fff}.route:first-child p{color:rgba(255,255,255,.78)}.route:first-child:after{color:#fff}.photo-card{border-radius:34px;min-height:640px}.two-col{gap:78px}.content-card,.review,.trust-card,.episode,.info-card,.training-card{border-radius:26px;border:0;box-shadow:0 14px 42px rgba(37,43,61,.06);background:#fff}.media-card,.media-logo-small{border-radius:22px;border:0;background:#fff}.review:first-child{background:var(--brand);color:#fff}.review:first-child:before{color:#fff}.review:first-child strong{color:#fff}\n.page-hero{padding:34px 0 82px;background:#fbfaf8}.page-hero>.container{background:var(--brand-dark);color:#fff;border-radius:32px;padding:56px;gap:54px}.page-hero h1{color:#fff;font-size:clamp(3.3rem,5.2vw,5.4rem)}.page-hero .lead{color:rgba(255,255,255,.78)}.page-hero .eyebrow{color:#ddd4c8}.page-hero-photo{border-radius:22px;box-shadow:none}.page-hero .btn.secondary{color:#fff;border-color:rgba(255,255,255,.62);background:transparent}.page-hero .btn.secondary:hover{color:var(--brand-dark);background:#fff;border-color:#fff}.cta{padding:96px 0;background:#efe8df}.cta-box{border:0;border-radius:30px;background:#fff;box-shadow:var(--shadow)}.site-footer{background:#24293d}\n.section.mist .content-card,.section.mist .training-card,.section.mist .info-card,.section.mist .episode,.section.mist .contact-panel{color:var(--ink)}.section.mist .content-card h2,.section.mist .content-card h3,.section.mist .training-card h2,.section.mist .training-card h3,.section.mist .info-card h2,.section.mist .info-card h3,.section.mist .episode h2,.section.mist .episode h3,.section.mist .contact-panel h2,.section.mist .contact-panel h3{color:var(--brand-dark)}\n@media(max-width:900px){.site-header .nav-links{background:var(--brand-dark)}.hero>.container{width:min(100% - 32px,1180px);padding:0;margin:auto}.hero-grid{grid-template-columns:1fr;min-height:0}.hero-copy{padding:68px 0 18px}.hero-photo{min-height:520px;border-radius:30px 30px 0 0}.stats{background:#fbfaf8;padding-top:26px}.page-hero>.container{padding:36px;grid-template-columns:1fr}}@media(max-width:560px){.hero h1{font-size:3.35rem}.section{padding:84px 0}.page-hero>.container{padding:30px 26px}.route{padding:32px}}\n";
  s=s.replace(/<body class="design-v\d+"[^>]*>/, '<body class="design-v10" data-design="Quiet Confidence">');
  s=s.replace('</head>','<style>'+css+'</style></head>');
  document.open(); document.write(s); document.close();
})().catch(e=>{document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">Kon deze ontwerpvariant niet laden.</p>';console.error(e)});
</script></body></html>
