function section(){return(location.hash||'#home').slice(1)}function report(s){try{parent.postMessage({type:'just-grow-section',section:s},'*')}catch(e){}}
function patch(){
 try{const d=frame.contentDocument;if(!d)return;if(!d.getElementById('jg-docstyle')){const st=d.createElement('style');st.id='jg-docstyle';st.textContent=CSS;d.head.appendChild(st)}d.body.className='design-v14';d.querySelectorAll('.brand-logo').forEach(i=>i.src=LOGO);d.querySelectorAll('.footer-logo').forEach(i=>i.src=LOGO);d.querySelectorAll('.hero-photo,.page-hero-photo').forEach(x=>x.style.marginTop='0');d.querySelectorAll('.video-placeholder').forEach(x=>x.remove());
 const hash=frame.contentWindow.location.hash||'#home';
 if(hash.startsWith('#home')){
const home=d.getElementById('page-mount');
const hero=home?.querySelector('.hero');
if(hero){
 const h1=hero.querySelector('h1'); if(h1) h1.textContent='Hier komen kennis en ervaring samen.';
 const lead=hero.querySelector('.lead'); if(lead) lead.textContent='Zodat jij je niet hoeft te bewijzen of uit te leggen, maar we direct kunnen kijken naar wat er nodig is.';
 hero.querySelector('.hero-quote')?.remove();
}
const routeHeads=[...home?.querySelectorAll('.route h3')||[]];
if(routeHeads[0]) routeHeads[0].textContent='Ben je zwanger (geweest) en had je Hyperemesis Gravidarum?';
if(routeHeads[0]?.nextElementSibling) routeHeads[0].nextElementSibling.textContent='Dan kan ik jou helpen met coaching en/of EMDR therapie.';
if(routeHeads[1]) routeHeads[1].textContent='Ben jij verloskundige en wil je jouw zorg rondom zwangeren met HG zo optimaal mogelijk maken?';
if(routeHeads[1]?.nextElementSibling) routeHeads[1].nextElementSibling.textContent='Ik geef praktische cursussen die jou hierbij zeker weten gaan helpen.';
[...home?.querySelectorAll('h2')||[]].forEach(h=>{
 if(h.textContent.includes('Twee routes')) h.textContent='Coaching, EMDR en scholing';
 if(h.textContent.includes('Waarom zo gepassioneerd')) h.textContent='Wie ben ik? En waarom zo gepassioneerd over Hyperemesis Gravidarum?';
 if(h.textContent.includes('Wat cliënten')) h.textContent='Reviews';
 if(h.textContent.includes('HG verdient meer bekendheid')) h.textContent='In de media';
});
}
 if(hash.startsWith('#coaching-emdr')){
const m=d.getElementById('page-mount');
const h1=m?.querySelector('h1'); if(h1) h1.textContent='Coaching & EMDR';
[...m?.querySelectorAll('section')||[]].forEach(s=>{
 const tx=s.textContent.toLowerCase();
 if(tx.includes('meestal begint het met een mailtje')||tx.includes('we kijken vanuit verschillende invalshoeken')||tx.includes('maar hoe werkt zo’n sessie dan precies')) s.remove();
});
[...m?.querySelectorAll('h2')||[]].forEach(h=>{
 if(h.textContent.includes('HG vraagt vaak om maatwerk')) h.textContent='Coaching bij Hyperemesis Gravidarum';
 if(h.textContent.includes('Een heftige herinnering')) h.textContent='EMDR';
 if(h.textContent.includes('Ervaringen uit de praktijk')) h.textContent='Reviews';
});
}
 if(hash.startsWith('#contact')){
const m=d.getElementById('page-mount'); const h1=m?.querySelector('h1'); if(h1) h1.textContent='Contact';
[...m?.querySelectorAll('section.cta')||[]].forEach(s=>{if(s.textContent.toLowerCase().includes('meestal begint het met een mailtje'))s.remove()});
}
 if(hash.startsWith('#online-programmas')){
const m=d.getElementById('page-mount'); const h1=m?.querySelector('h1'); if(h1) h1.textContent='Online programma’s';
}
 if(hash.startsWith('#scholing')){
const m=d.getElementById('page-mount'); const h1=m?.querySelector('h1'); if(h1) h1.textContent='Scholing';
}
 if(hash.startsWith('#podcast')){
const m=d.getElementById('page-mount'); const h1=m?.querySelector('h1'); if(h1) h1.textContent='Podcast';
}
 if(!d.documentElement.dataset.docObs){d.documentElement.dataset.docObs='1';new MutationObserver(()=>setTimeout(patch,0)).observe(d.getElementById('page-mount'),{childList:true,subtree:false});d.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');const h=a?.getAttribute('href')||'';if(/^mailto:|^tel:/i.test(h)){e.preventDefault();top.location.href=h}},true)}
 }catch(e){}
}

addEventListener('hashchange',()=>{const s=section();try{frame.contentWindow.location.hash=s}catch(e){}report(s)});
addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='just-grow-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);report(s)}if(e.data?.type==='just-grow-set-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)location.hash=s;try{frame.contentWindow.postMessage(e.data,'*')}catch(x){}}});
frame.src='just-grow-v5-standalone.html#'+section();
