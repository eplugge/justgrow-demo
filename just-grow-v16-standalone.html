<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Just Grow — Soft Editorial</title><style>html,body{height:100%;margin:0;overflow:hidden}#site{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="site"></iframe><script>
const frame=document.getElementById('site');
const CSS=`body{background:#fefeff!important}.site-header{background:#fefeff!important;border-bottom:1px solid #e7e8ec!important}.hero-grid{grid-template-columns:.92fr 1.08fr!important;gap:72px!important;align-items:start!important}.hero-copy,.hero-photo,.page-hero-photo{margin-top:0!important}.hero h1,.page-hero h1{font-family:Georgia,"Times New Roman",serif!important;font-weight:400!important;letter-spacing:-.02em!important}.hero-photo{border-radius:2px!important;box-shadow:none!important}.stats{background:#fff!important}.stats-grid{gap:0!important;background:#fff!important;border-top:1px solid #dde0e5!important;border-bottom:1px solid #dde0e5!important;overflow:visible!important}.stat{background:#fff!important;border:0!important;border-radius:0!important;border-right:1px solid #dde0e5!important}.stat:last-child{border-right:0!important}.route{border:0!important;border-top:1px solid #cfd2da!important;border-radius:0!important;padding:30px 0!important;box-shadow:none!important}.section.soft{background:#f5f1eb!important}.section.mist{background:#f1f2f4!important}.review{border-radius:0!important;border-left:1px solid #cfd2da!important;border-top:0!important;border-right:0!important;border-bottom:0!important;box-shadow:none!important}.content-card,.trust-card,.contact-panel,.training-card,.episode{border-radius:2px!important;box-shadow:none!important}.site-footer{background:#4c5270!important}h1{font-size:clamp(2.15rem,3.35vw,3.35rem)!important}h2{font-size:clamp(1.55rem,2.25vw,2.15rem)!important}@media(max-width:900px){.hero-grid{grid-template-columns:1fr!important;gap:28px!important}.stats-grid{gap:10px!important;border:0!important}.stat{border:1px solid #dde0e5!important;border-radius:8px!important}}`;
function sec(){return(location.hash||'#home').slice(1)}function report(s){try{parent.postMessage({type:'just-grow-section',section:s},'*')}catch(e){}}
function patch(){try{const outer=frame.contentDocument,inner=outer?.getElementById('site');if(!inner)return;const apply=()=>{try{const d=inner.contentDocument;if(!d)return;let st=d.getElementById('jg-v16');if(!st){st=d.createElement('style');st.id='jg-v16';st.textContent=CSS;d.head.appendChild(st)}d.querySelectorAll('.hero-photo,.page-hero-photo').forEach(x=>x.style.marginTop='0')}catch(e){}};inner.addEventListener('load',apply,{once:false});apply()}catch(e){}}
frame.addEventListener('load',()=>{patch();const s=sec();try{frame.contentWindow.location.hash=s}catch(e){}report(s)});addEventListener('hashchange',()=>{const s=sec();try{frame.contentWindow.location.hash=s}catch(e){}report(s)});addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='just-grow-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);report(s)}if(e.data?.type==='just-grow-set-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)location.hash=s;try{frame.contentWindow.postMessage(e.data,'*')}catch(x){}}});frame.src='just-grow-v14-standalone.html#'+sec();
</script></body></html>
