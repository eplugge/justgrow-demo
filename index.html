<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fefeff"><title>Just Grow — concepten</title>
<style>:root{--brand:#4c5270;--paper:#fefeff;--glass:rgba(254,254,255,.87);--shadow:0 14px 42px rgba(38,42,58,.16),0 2px 8px rgba(38,42,58,.07)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.preview{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.picker-wrap{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9999;pointer-events:none;max-width:calc(100vw - 24px)}.picker{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.12);-webkit-backdrop-filter:blur(18px) saturate(1.12)}button{appearance:none;border:0;font:inherit;color:var(--brand);cursor:pointer;-webkit-tap-highlight-color:transparent}.arrow{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:transparent;font-size:24px;font-weight:300;line-height:1;transition:.18s ease}.arrow:hover{background:rgba(76,82,112,.08);transform:translateY(-1px)}.arrow:disabled{opacity:.22;cursor:default;transform:none;background:transparent}.dots{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}.dot{width:34px;height:34px;border-radius:50%;background:rgba(254,254,255,.72);border:1px solid rgba(76,82,112,.18);font-size:13px;font-weight:650;transition:.18s ease}.dot:hover{background:rgba(76,82,112,.08);transform:translateY(-1px)}.dot.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 5px 14px rgba(76,82,112,.28);transform:scale(1.04)}@media(max-width:620px){.picker-wrap{bottom:max(10px,env(safe-area-inset-bottom));width:calc(100vw - 18px)}.picker{gap:4px;padding:6px 8px}.arrow{width:30px;height:30px;font-size:21px}.dot{width:28px;height:28px;font-size:11px}.dots{gap:4px}}</style></head><body>
<iframe id="preview" class="preview" title="Just Grow concept preview"></iframe><div class="picker-wrap"><nav class="picker" aria-label="Conceptversies"><button id="prev" class="arrow" type="button" aria-label="Vorige versie">‹</button><div id="dots" class="dots"></div><button id="next" class="arrow" type="button" aria-label="Volgende versie">›</button></nav></div>
<script>
const versions=[{"n":1,"file":"just-grow-v1-standalone.html","label":"Concept 1"},{"n":2,"file":"just-grow-v2-standalone.html","label":"Concept 2"},{"n":3,"file":"just-grow-v3-standalone.html","label":"Concept 3"},{"n":4,"file":"just-grow-v4-standalone.html","label":"Concept 4"},{"n":5,"file":"just-grow-v5-standalone.html","label":"Concept 5"},{"n":6,"file":"just-grow-v6-standalone.html","label":"Concept 6"},{"n":7,"file":"just-grow-v7-standalone.html","label":"Concept 7"},{"n":8,"file":"just-grow-v8-standalone.html","label":"v8 — Nordic Clarity"},{"n":9,"file":"just-grow-v9-standalone.html","label":"v9 — Warm Journal"},{"n":10,"file":"just-grow-v10-standalone.html","label":"v10 — Quiet Confidence"},{"n":11,"file":"just-grow-v11-standalone.html","label":"v11 — Quiet Editorial"},{"n":12,"file":"just-grow-v12-standalone.html","label":"v12 — Warm Sectioned"},{"n":13,"file":"just-grow-v13-standalone.html","label":"v13 — Calm Studio"},{"n":14,"file":"just-grow-v14-standalone.html","label":"v14 — Aligned Calm"},{"n":15,"file":"just-grow-v15-standalone.html","label":"v15 — Warm Cards"},{"n":16,"file":"just-grow-v16-standalone.html","label":"v16 — Soft Editorial"},{"n":17,"file":"just-grow-v17-standalone.html","label":"v17 - Editorial Ledger"},{"n":18,"file":"just-grow-v18-standalone.html","label":"v18 - Care Atlas"},{"n":19,"file":"just-grow-v19-standalone.html","label":"v19 - Warm Retreat"}];
const preview=document.getElementById('preview'),dots=document.getElementById('dots'),prev=document.getElementById('prev'),next=document.getElementById('next');function P(){return new URLSearchParams(location.search)}function fromUrl(){const n=Number(P().get('v'));return versions.some(x=>x.n===n)?n:versions[0].n}function sectionFromUrl(){const s=(P().get('section')||'home').replace(/^#/,'');return /^[a-z0-9-\/]+$/i.test(s)?s:'home'}let current=fromUrl(),currentSection=sectionFromUrl();function updateUrl(){const u=new URL(location.href);u.searchParams.set('v',current);if(currentSection!=='home')u.searchParams.set('section',currentSection);else u.searchParams.delete('section');history.replaceState({v:current,section:currentSection},'',u)}function show(n,update=true){const item=versions.find(x=>x.n===n)||versions[0];current=item.n;preview.src=item.file+'#'+(currentSection||'home');preview.title=item.label;[...dots.children].forEach(b=>{const a=Number(b.dataset.v)===current;b.classList.toggle('active',a);b.setAttribute('aria-current',a?'true':'false')});const i=versions.findIndex(x=>x.n===current);prev.disabled=i===0;next.disabled=i===versions.length-1;if(update)updateUrl()}versions.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='dot';b.dataset.v=item.n;b.textContent=item.n;b.title=item.label;b.setAttribute('aria-label','Toon '+item.label);b.onclick=()=>show(item.n);dots.appendChild(b)});prev.onclick=()=>{const i=versions.findIndex(x=>x.n===current);if(i>0)show(versions[i-1].n)};next.onclick=()=>{const i=versions.findIndex(x=>x.n===current);if(i<versions.length-1)show(versions[i+1].n)};addEventListener('message',e=>{if(e.source!==preview.contentWindow||!e.data||e.data.type!=='just-grow-section')return;const s=String(e.data.section||'home').replace(/^#/,'');if(!/^[a-z0-9-\/]+$/i.test(s))return;if(s!==currentSection){currentSection=s;updateUrl()}});function bridgeLegacyConceptFixes(){
 if(current!==11&&current!==12)return;
 const tryApply=()=>{
  try{
   const outer=preview.contentDocument;
   const inner=outer&&outer.getElementById('site');
   if(!inner)return;
   const apply=()=>{
    try{
     const d=inner.contentDocument;if(!d)return;
     let st=d.getElementById('jg-v11-v12-hotfix');
     if(!st){
      st=d.createElement('style');st.id='jg-v11-v12-hotfix';
      st.textContent='.hero-photo,.page-hero-photo{margin-top:0!important}.stats{background:#fff!important}.stats-grid{background:transparent!important;gap:14px!important;overflow:visible!important;border:0!important}.stat{background:#fff!important;border:1px solid #e5e6ea!important;border-radius:18px!important;overflow:hidden!important}';
      d.head.appendChild(st);
     }
    }catch(e){}
   };
   inner.addEventListener('load',apply,{once:false});apply();
  }catch(e){}
 };
 setTimeout(tryApply,0);setTimeout(tryApply,250);
}
function bridgeExternalSchemes(){try{const doc=preview.contentDocument;if(!doc||doc.documentElement.dataset.jgExternalBridge)return;doc.documentElement.dataset.jgExternalBridge='1';doc.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const href=a.getAttribute('href')||'';if(/^mailto:|^tel:/i.test(href)){e.preventDefault();window.location.href=href}},true)}catch(e){}}preview.addEventListener('load',()=>{bridgeExternalSchemes();bridgeLegacyConceptFixes();try{preview.contentWindow.postMessage({type:'just-grow-set-section',section:currentSection},'*')}catch(e){}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});addEventListener('popstate',()=>{current=fromUrl();currentSection=sectionFromUrl();show(current,false)});show(current,false);
</script></body></html>
