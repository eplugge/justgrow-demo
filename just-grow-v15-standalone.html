<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Just Grow — Warm Cards</title><style>html,body{height:100%;margin:0;overflow:hidden}#site{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="site"></iframe><script>
const frame=document.getElementById('site');
const CSS=`body{background:#faf8f4!important}.site-header{background:#fff!important;border-bottom:1px solid rgba(76,82,112,.10)!important}.hero{background:#fff!important}.hero-grid{grid-template-columns:1fr 1fr!important;gap:34px!important;align-items:start!important}.hero-copy,.hero-photo{margin-top:0!important;border-radius:24px!important;overflow:hidden}.hero-copy{background:#f4efe8!important;padding:38px!important;border:1px solid #e8e0d6!important}.hero-photo{box-shadow:none!important}.stats{background:#fff!important}.stats-grid{background:transparent!important;gap:14px!important;border:0!important;overflow:visible!important}.stat{background:#fff!important;border:1px solid #e5e6ea!important;border-radius:16px!important;box-shadow:0 7px 22px rgba(45,49,68,.035)!important}.section.soft{background:#eee7dd!important}.section.mist{background:#eef0f2!important}.route,.photo-card,.content-card,.trust-card,.contact-panel,.review,.training-card,.episode{border-radius:20px!important;box-shadow:none!important}.site-footer{background:#4c5270!important}h1{font-size:clamp(2.15rem,3.35vw,3.35rem)!important}h2{font-size:clamp(1.55rem,2.25vw,2.15rem)!important}@media(max-width:900px){.hero-grid{grid-template-columns:1fr!important}.hero-copy{padding:28px!important}}`;
function sec(){return(location.hash||'#home').slice(1)}function report(s){try{parent.postMessage({type:'just-grow-section',section:s},'*')}catch(e){}}
function patch(){try{const outer=frame.contentDocument,inner=outer?.getElementById('site');if(!inner)return;const apply=()=>{try{const d=inner.contentDocument;if(!d)return;let st=d.getElementById('jg-v15');if(!st){st=d.createElement('style');st.id='jg-v15';st.textContent=CSS;d.head.appendChild(st)}d.querySelectorAll('.hero-photo,.page-hero-photo').forEach(x=>x.style.marginTop='0')}catch(e){}};inner.addEventListener('load',apply,{once:false});apply()}catch(e){}}
frame.addEventListener('load',()=>{patch();const s=sec();try{frame.contentWindow.location.hash=s}catch(e){}report(s)});addEventListener('hashchange',()=>{const s=sec();try{frame.contentWindow.location.hash=s}catch(e){}report(s)});addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='just-grow-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)history.replaceState(null,'','#'+s);report(s)}if(e.data?.type==='just-grow-set-section'){const s=String(e.data.section||'home').replace(/^#/,'');if(location.hash!=='#'+s)location.hash=s;try{frame.contentWindow.postMessage(e.data,'*')}catch(x){}}});frame.src='just-grow-v14-standalone.html#'+sec();
</script></body></html>
