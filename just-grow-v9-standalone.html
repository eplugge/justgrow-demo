<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Just Grow — Warm Journal</title></head><body>
<script>
(async()=>{
  const r=await fetch('just-grow-v1-standalone.html',{cache:'no-store'});
  let s=await r.text();
  const css="\n/* v9 — Warm Journal */\n:root{--ink:#2c2a2d;--brand:#4c5270;--brand-dark:#34364c;--paper:#fffdfa;--sand:#eee5d9;--mist:#f4f0eb;--line:#d9d2ca;--soft:#77706d;--shadow:0 18px 48px rgba(50,44,44,.08);--radius:4px}\nbody{background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}h1,h2,h3{font-family:Georgia,\"Times New Roman\",serif;font-weight:500;letter-spacing:-.035em}.eyebrow{font-size:.7rem;letter-spacing:.20em}\n.site-header{background:rgba(255,253,250,.96);border-bottom:1px solid #ded8d0}.nav{height:92px}.brand-logo{width:152px!important;height:68px!important}.nav-links a{font-size:.86rem;font-weight:600}\n.hero{padding:74px 0 84px}.hero-grid{grid-template-columns:1.05fr .95fr;gap:82px}.hero-copy{align-self:center}.hero h1{font-size:clamp(3.5rem,6.2vw,6.4rem);line-height:.96}.hero .lead{font-size:1.1rem;max-width:600px}.hero-photo{min-height:650px;border-radius:2px;box-shadow:none}.hero-photo:before{content:\"\";position:absolute;left:-18px;top:24px;bottom:-18px;width:1px;background:#bdb4aa}.hero-quote{left:-52px;right:38px;bottom:40px;border-radius:0;border:0;border-top:1px solid var(--brand);background:#fffdfa;box-shadow:0 18px 45px rgba(50,44,44,.12);font-family:Georgia,serif;font-size:1.12rem}\n.stats{padding:6px 0 88px}.stats-grid{border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:transparent}.stat{padding:30px 26px}.stat strong{font-family:Georgia,serif;font-weight:500;font-size:2rem}.stat span{text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}\n.section{padding:120px 0}.section.soft{background:#eee5d9}.section.mist{background:#f4f0eb}.section-head{margin-bottom:54px}.section-head h2{font-size:clamp(2.7rem,4.4vw,4.3rem)}.route-grid{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.route{border:0;border-radius:0;background:transparent;padding:48px 42px}.route+.route{border-left:1px solid var(--line)}.route h3{font-size:1.75rem}.route:after{top:44px}.two-col{gap:88px}.photo-card{border-radius:0;box-shadow:none;min-height:620px}.content-card,.review,.trust-card,.episode,.info-card,.training-card{border-radius:0;box-shadow:none}.quote{font-family:Georgia,serif;font-size:1.45rem;border-left:0;padding:28px 0;border-top:1px solid var(--brand);border-bottom:1px solid var(--brand);background:transparent}.review-grid{gap:0;border-top:1px solid var(--line)}.review{border:0;border-bottom:1px solid var(--line);padding:40px 30px;background:transparent}.review p{font-family:Georgia,serif;font-size:1.15rem}.media-featured{gap:1px;background:var(--line);border:1px solid var(--line)}.media-card{border:0;border-radius:0}.media-logo-grid{gap:1px;background:var(--line);border:1px solid var(--line)}.media-logo-small{border:0;border-radius:0}\n.page-hero{padding:84px 0;border-bottom:1px solid var(--line)}.page-hero>.container{gap:84px}.page-hero h1{font-size:clamp(3.4rem,5.5vw,5.8rem)}.page-hero-photo{border-radius:0;box-shadow:none;min-height:470px}.cta{padding:108px 0;background:#eee5d9}.cta-box{border:0;border-top:1px solid var(--brand);border-bottom:1px solid var(--brand);border-radius:0;background:transparent;padding:52px 0}.site-footer{background:#34364c}\n.section.mist .content-card,.section.mist .training-card,.section.mist .info-card,.section.mist .episode,.section.mist .contact-panel{color:var(--ink)}.section.mist .content-card h2,.section.mist .content-card h3,.section.mist .training-card h2,.section.mist .training-card h3,.section.mist .info-card h2,.section.mist .info-card h3,.section.mist .episode h2,.section.mist .episode h3,.section.mist .contact-panel h2,.section.mist .contact-panel h3{color:var(--brand-dark)}\n@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:42px}.hero-photo{min-height:500px}.hero-quote{left:20px;right:20px}.route+.route{border-left:0;border-top:1px solid var(--line)}.two-col{gap:44px}.page-hero>.container{gap:40px}}@media(max-width:560px){.hero{padding-top:44px}.hero h1{font-size:3.35rem}.section{padding:86px 0}.route{padding:34px 4px}.cta-box{padding:40px 0}}\n";

</script></body></html>
